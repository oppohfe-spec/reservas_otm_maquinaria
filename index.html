<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const APP_VERSION = '1.1';   // subir en cada cambio (el Sheet rechaza versiones viejas)
const CONFIG = {
  // URL del Apps Script publicado ("Implementar > Nueva implementación > Aplicación web")
  API_URL: 'https://script.google.com/macros/s/AKfycbzYM6CxKzGyXwL-5c3UbWpH4RAifYVx5R7co2DjFgknQ7pIP52aYbaHRYdk9dl6SVJw/exec',
  // Número de WhatsApp destino con código de país, sin + ni espacios (ej. '51987654321').
  // Vacío = WhatsApp pregunta a qué contacto o grupo enviar.
  WHATSAPP_NUMERO: '',
  ESTADO_ASIGNABLE: 'LIB.',
  MONEDA: 'S/',
  PAGE_SIZE: 50,
};

const sleep = ms => new Promise(r=>setTimeout(r, ms));

/* fetch con tiempo límite (sin AbortController: algunos WebViews no lo clonan) */
function fetchTimeout(url, opts={}, ms=45000){
  let t;
  const limite = new Promise((_, rej)=>{ t = setTimeout(()=>{ const e = new Error('Tiempo de espera agotado'); e.name='AbortError'; rej(e); }, ms); });
  return Promise.race([fetch(url, opts), limite]).finally(()=>clearTimeout(t));
}
/* GET con anti-caché + reintentos (evita el 404 intermitente de la redirección de Apps Script) */
async function apiGet(action='snapshot', intentos=3){
  let ultimoError;
  for(let i=0;i<intentos;i++){
    try{
      const url = `${CONFIG.API_URL}?action=${action}&_=${Date.now()}_${i}`;
      const res = await fetchTimeout(url, {method:'GET', cache:'no-store', redirect:'follow'});
      if(!res.ok) throw new Error('No se pudo leer el Sheet ('+res.status+')');
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Error desconocido leyendo el Sheet');
      return data;
    }catch(err){
      ultimoError = err.name==='AbortError' ? new Error('Tiempo de espera agotado') : err;
      if(i < intentos-1) await sleep(800*(i+1));
    }
  }
  throw ultimoError;
}
async function apiPost(action, payload, intentos=2){
  let ultimoError;
  for(let i=0;i<intentos;i++){
    try{
      // text/plain evita el preflight CORS que Apps Script no responde
      const res = await fetchTimeout(CONFIG.API_URL, {
        method:'POST', cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action, payload, v: APP_VERSION})
      }, 90000);
      if(!res.ok) throw new Error('Error del servidor ('+res.status+')');
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Error desconocido guardando en el Sheet');
      return data;
    }catch(err){
      ultimoError = err.name==='AbortError' ? new Error('Tiempo de espera agotado') : err;
      if(/versión antigua/i.test(ultimoError.message)) mostrarAvisoVersion();
      if(!/servidor|Failed to fetch|Tiempo|NetworkError|Load failed/i.test(ultimoError.message)) break;  // error de negocio: no reintentar
      if(i < intentos-1) await sleep(1000);
    }
  }
  throw ultimoError;
}
function mostrarAvisoVersion(){
  if(document.getElementById('avisoVersion')) return;
  document.body.insertAdjacentHTML('afterbegin', `<div id="avisoVersion" class="fixed top-0 inset-x-0 z-[80] bg-amber-500 text-white text-sm font-medium px-4 py-2.5 flex items-center justify-center gap-3">
    Hay una versión nueva de la app.
    <button onclick="location.reload()" class="px-3 py-1 rounded-md bg-white text-amber-700 text-xs font-semibold">Actualizar ahora</button></div>`);
}
function compararVersion(a, b){
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){ const x=pa[i]||0, y=pb[i]||0; if(x!==y) return x<y?-1:1; }
  return 0;
}

/* =========================================================
   UTILIDADES
   ========================================================= */
const TZ = 'America/Lima';
const _fmtISO = new Intl.DateTimeFormat('en-CA',{timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'});
function isoDate(d){ return _fmtISO.format(d); }
function hoyLima(){ return isoDate(new Date()); }
function addDaysISO(iso, n){ const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function lunesDeISO(iso){ const d = new Date(iso+'T00:00:00Z'); const dow = (d.getUTCDay()+6)%7; return addDaysISO(iso, -dow); }
function fmtDate(d){ if(!d) return '—'; d = new Date(d); return isNaN(d) ? '—' : d.toLocaleDateString('es-PE',{timeZone:TZ, day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; d = new Date(d); return isNaN(d) ? '—' : d.toLocaleString('es-PE',{timeZone:TZ, day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}); }
const ddmm = iso => iso.slice(8,10)+'/'+iso.slice(5,7);
const _money = new Intl.NumberFormat('es-PE',{minimumFractionDigits:2, maximumFractionDigits:2});
const _num = new Intl.NumberFormat('es-PE',{maximumFractionDigits:3});
function money(n){ return CONFIG.MONEDA+' '+_money.format(Number(n)||0); }
function moneyK(n){ n = Number(n)||0; return Math.abs(n) >= 1e6 ? CONFIG.MONEDA+' '+(n/1e6).toFixed(2)+' M' : Math.abs(n) >= 1e4 ? CONFIG.MONEDA+' '+(n/1e3).toFixed(1)+' k' : money(n); }
function num(n){ return _num.format(Number(n)||0); }
function pct(a, b){ return b ? Math.round(a*1000/b)/10 + '%' : '—'; }
function norm(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function tokens(q){ return norm(q).split(/[\s,;]+/).filter(Boolean); }
function coincide(hay, toks){ return toks.every(t => hay.includes(t)); }
function jsq(s){ return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return Date.now().toString(36)+Math.random().toString(36).slice(2); } }
function familia(cod){ const m = String(cod).match(/^[A-Za-z]+/); return m ? m[0].toUpperCase() : 'OTROS'; }
function round3(n){ return Math.round(n*1000)/1000; }

/* =========================================================
   ESTADO
   ========================================================= */
let ORDENES = [];      // IW38
let ORD_MAP = {};
let STOCK = [];        // MB52 (solo con stock > 0)
let STOCK_MAP = {};
let RESERVAS = [];     // líneas de la hoja RESERVAS
let COMPROMETIDO = {}; // material -> cantidad en reservas Pendiente
let POR_ORDEN = {};    // orden -> {gasto, lineas, reservas:Set}
let CORE_OK = false, STOCK_OK = false;
let stockCargando = null;
let stockHora = 0;
let CART = lsGet('mq_cart') || {orden:'', items:[], token:''};
let SOLICITANTE = lsGet('mq_solicitante') || '';

const TIPO_COLOR = {'OTM PREVENTIVA':'#059669','OTM CORRECTIVA':'#dc2626','OTM MEJORA':'#7c3aed'};
const ESTADO_RES_CLS = {Pendiente:'bg-amber-50 text-amber-700 ring-amber-200', Atendida:'bg-emerald-50 text-emerald-700 ring-emerald-200', Anulada:'bg-ink-100 text-ink-500 ring-ink-200'};
const esAsignable = o => o && String(o.estado).toUpperCase() === CONFIG.ESTADO_ASIGNABLE;
const activa = r => r.estado !== 'Anulada';

function aplicarCore(d){
  if(d.estadoAsignable) CONFIG.ESTADO_ASIGNABLE = d.estadoAsignable;
  ORDENES = (d.ordenes||[]).map(o=>({...o, orden:String(o.orden), _q: norm([o.orden,o.texto,o.equipo,o.denom,o.ubic,o.tipo].join(' '))}));
  ORDENES.sort((a,b)=> String(b.fecha||'').localeCompare(String(a.fecha||'')) || b.orden.localeCompare(a.orden));
  ORD_MAP = {}; ORDENES.forEach(o=> ORD_MAP[o.orden] = o);
  RESERVAS = (d.reservas||[]).map(r=>({...r}));
  CORE_OK = true;
  recalcular();
}
function aplicarStock(lista){
  STOCK = (lista||[]).map(m=> Array.isArray(m)
    ? {codigo:String(m[0]), desc:String(m[1]||''), um:String(m[2]||''), stock:Number(m[3])||0, valor:Number(m[4])||0, moneda:m[5]||'PEN'}
    : m);
  STOCK.forEach(m=>{ m.cu = m.stock ? m.valor/m.stock : 0; m.fam = familia(m.codigo); m._q = norm(m.codigo+' '+m.desc); });
  STOCK_MAP = {}; STOCK.forEach(m=> STOCK_MAP[m.codigo] = m);
  STOCK_OK = true;
}
function recalcular(){
  COMPROMETIDO = {}; POR_ORDEN = {};
  RESERVAS.forEach(r=>{
    if(r.estado === 'Pendiente') COMPROMETIDO[r.material] = (COMPROMETIDO[r.material]||0) + r.cantidad;
    if(!activa(r)) return;
    const p = POR_ORDEN[r.orden] = POR_ORDEN[r.orden] || {gasto:0, lineas:0, reservas:new Set()};
    p.gasto += r.total; p.lineas++; p.reservas.add(r.reserva);
  });
}
/** Disponible = stock MB52 − reservas Pendiente (sin contar lo que está en la reserva en curso) */
function disponible(cod){ const m = STOCK_MAP[cod]; return m ? round3(m.stock - (COMPROMETIDO[cod]||0)) : 0; }
function enCarrito(cod){ const it = CART.items.find(x=>x.codigo===cod); return it ? it.cantidad : 0; }

function paintSync(txt){ const el = document.getElementById('syncStatus'); if(el) el.textContent = txt||''; }
async function initApp(){
  document.getElementById('appVersion').textContent = 'v'+APP_VERSION;
  const cCore = lsGet('mq_cache_core'), cStock = lsGet('mq_cache_stock');
  if(cStock) aplicarStock(cStock);
  if(cCore){ aplicarCore(cCore); CORE_OK = false; paintSync('Actualizando datos…'); }
  navigate(lsGet('mq_vista') || 'dashboard');
  paintCartBar();
  try{
    await cargarCore();
    cargarStock();
  }catch(err){
    if(cCore){ paintSync('Sin conexión: mostrando últimos datos'); toast('No se pudo actualizar desde el Sheet: '+err.message, 'error'); return; }
    console.error(err);
    document.getElementById('view-'+vistaActual()).innerHTML = `<div class="bg-white rounded-xl shadow-card border border-red-200 p-6 text-sm text-red-700">
      No se pudo cargar la información desde el Sheet.<br><span class="text-ink-500">${esc(err.message)}</span><br><br>
      Verifica que <code>CONFIG.API_URL</code> apunte a tu Apps Script publicado y que el acceso esté configurado como "Cualquier usuario".
      <div class="mt-3"><button onclick="initApp()" class="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-medium">Reintentar</button></div></div>`;
  }
}
async function cargarCore(){
  const d = await apiGet('core');
  if(d.minAppVersion && compararVersion(APP_VERSION, d.minAppVersion) < 0) mostrarAvisoVersion();
  aplicarCore(d);
  lsSet('mq_cache_core', {ordenes:d.ordenes, reservas:d.reservas, estadoAsignable:d.estadoAsignable});
  paintSync('Datos al '+new Date().toLocaleTimeString('es-PE',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}));
  refrescarVista();
}
function cargarStock(maxEdadMs=0){
  if(stockCargando) return stockCargando;
  if(maxEdadMs && STOCK_OK && Date.now()-stockHora < maxEdadMs) return Promise.resolve();
  const st = document.getElementById('stockInfo'); if(st) st.textContent = 'Actualizando stock…';
  stockCargando = (async ()=>{
    try{
      const d = await apiGet('materiales');
      stockHora = Date.now();
      aplicarStock(d.materiales);
      lsSet('mq_cache_stock', d.materiales);
      refrescarVista();
    }catch(err){ console.error(err); toast('No se pudo actualizar el stock: '+err.message, 'error'); }
    finally{ stockCargando = null; const s2 = document.getElementById('stockInfo'); if(s2) s2.textContent = horaStock(); }
  })();
  return stockCargando;
}
function horaStock(){ return stockHora ? 'Stock leído a las '+new Date(stockHora).toLocaleTimeString('es-PE',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}) : (STOCK_OK ? 'Stock de la última sesión' : 'Cargando stock…'); }
async function recargarTodo(){
  const ico = document.getElementById('icoSync'); ico.classList.add('animate-spin');
  try{ await cargarCore(); await cargarStock(); toast('Datos actualizados', 'info'); }
  catch(err){ toast('No se pudo actualizar: '+err.message, 'error'); }
  finally{ ico.classList.remove('animate-spin'); }
}

let modalRefresh = null;
function abrirModal(html, onRefresh=null, ancho='max-w-2xl'){
  const mismo = onRefresh && onRefresh === modalRefresh;   // re-pintado del mismo modal
  modalRefresh = onRefresh;
  const panel = document.getElementById('modalPanel');
  if(panel && panel.dataset.ancho === ancho && !mismo){ panel.innerHTML = html; panel.scrollTop = 0; paintCartBar(); return; }
  if(panel && mismo){
    /* Modal ya abierto: se cambia solo el contenido (sin animación ni salto de scroll)
       y se conserva el campo en el que se estaba escribiendo. */
    const act = document.activeElement, id = act && panel.contains(act) ? act.id : '';
    const val = id ? act.value : null, s = id && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
    const top = panel.scrollTop;
    panel.innerHTML = html;
    panel.scrollTop = top;
    if(id){ const el = document.getElementById(id); if(el){ if(val != null && el.value !== val) el.value = val; el.focus({preventScroll:true}); try{ if(s) el.setSelectionRange(s[0], s[1]); }catch(e){} } }
    return;
  }
  document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop fixed inset-0 z-40 flex items-center justify-center p-4" onmousedown="if(event.target===this) cerrarModal()">
    <div class="modal-panel bg-white rounded-xl shadow-pop w-full ${ancho} max-h-[90vh] overflow-y-auto" id="modalPanel" data-ancho="${ancho}">${html}</div></div>`;

const AC = {};
function acHTML(id, placeholder, valorInicial=''){
  return `<div class="relative"><input id="${id}" autocomplete="off" value="${esc(valorInicial)}" placeholder="${placeholder}" class="${selCls}"
    oninput="acFiltrar('${id}')" onfocus="acFiltrar('${id}')" onkeydown="acTecla(event,'${id}')" onblur="setTimeout(()=>acCerrar('${id}'),180)">

function acFiltrar(id){
  const cfg = AC[id]; if(!cfg) return;
  const q = document.getElementById(id).value;
  const toks = tokens(q);
  const items = cfg.items();
  const res = [];
  for(const it of items){ if(!toks.length || coincide(it.q, toks)){ res.push(it); if(res.length>=40) break; } }
  const list = document.getElementById(id+'_list');
  cfg.sel = 0; cfg.res = res;
  list.innerHTML = res.length ? res.map((it,i)=>`<div class="ac-item ${i===0?'sel':''}" onmousedown="acElegir('${id}',${i})">${it.html}</div>`).join('')
    : `<div class="px-3 py-3 text-xs text-ink-400">${cfg.vacio || 'Sin coincidencias'}</div>`;
  list.classList.remove('hidden');
}
function acTecla(e, id){
  const cfg = AC[id]; if(!cfg || !cfg.res) return;
  const list = document.getElementById(id+'_list');
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault(); cfg.sel = Math.max(0, Math.min(cfg.res.length-1, cfg.sel + (e.key==='ArrowDown'?1:-1)));
    [...list.children].forEach((c,i)=>c.classList.toggle('sel', i===cfg.sel));
    const s = list.children[cfg.sel]; if(s) s.scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){ e.preventDefault(); if(cfg.res.length) acElegir(id, cfg.sel); }
  else if(e.key==='Escape'){ acCerrar(id); }
}
function acElegir(id, i){ const cfg = AC[id]; const it = cfg.res[i]; if(!it) return; acCerrar(id); cfg.onPick(it.value); }

/* Semanas lunes-domingo (hora Lima): actual + 3 anteriores como máximo */
let SEM_F = lsGet('mq_sem_f') || 'todas';
function numSemanaISO(iso){
  const d = new Date(iso+'T00:00:00Z'); const dow = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate() - dow + 3);
  return Math.ceil(((d - Date.UTC(d.getUTCFullYear(),0,1))/86400000 + 1)/7);
}
function semanasFiltro(){
  const lunes = lunesDeISO(hoyLima());
  return [0,1,2,3].map(i=>{ const ini = addDaysISO(lunes, -7*i); return {key:'s'+i, ini, fin:addDaysISO(ini,6), num:numSemanaISO(ini),
    label: i===0 ? 'Semana actual' : i===1 ? 'Semana pasada' : `Hace ${i} semanas`}; });
}
function fechaOrdenISO(o){ return o && o.fecha ? isoDate(new Date(o.fecha)) : ''; }
/* 'todas' = desde el lunes de hace 3 semanas en adelante (incluye fechas futuras) */
function ordenEnSemana(o, key=SEM_F){
  const sems = semanasFiltro(), f = fechaOrdenISO(o);
  if(key === 'todas') return !f || f >= sems[3].ini;
  const s = sems.find(x=>x.key===key);
  return !!s && f >= s.ini && f <= s.fin;
}
function chipsSemanaHTML(acId){
  const lib = ORDENES.filter(esAsignable);
  const chip = (key, titulo, sub) => {
    const n = lib.filter(o=>ordenEnSemana(o, key)).length, act = SEM_F===key;
    return `<button type="button" onmousedown="event.preventDefault()" onclick="setSemana('${key}','${acId}')" class="shrink-0 px-2.5 py-1.5 rounded-lg text-left border ${act?'bg-ink-900 border-ink-900 text-white':'bg-white border-ink-200 text-ink-600 hover:bg-ink-50'}">
      <span class="block text-[11px] font-semibold leading-tight">${titulo} <span class="${act?'text-ink-300':'text-ink-400'} font-normal">(${n})</span></span>
      <span class="block text-[10px] ${act?'text-ink-300':'text-ink-400'} leading-tight">${sub}</span></button>`;
  };
  const sems = semanasFiltro();
  return `<div id="${acId}_sem" class="flex flex-wrap gap-1.5 mb-2">

function rangoFechas(){
  const hoy = hoyLima();
  if(DF.rango==='hoy') return [hoy, hoy];
  if(DF.rango==='semana') return [lunesDeISO(hoy), hoy];
  if(DF.rango==='mes') return [hoy.slice(0,8)+'01', hoy];
  if(DF.rango==='30d') return [addDaysISO(hoy,-29), hoy];
  if(DF.rango==='custom') return [DF.desde||'0000-01-01', DF.hasta||'9999-12-31'];
  return ['0000-01-01','9999-12-31'];
}
function reservasFiltradas(){
  const [d, h] = rangoFechas();
  return RESERVAS.filter(r=>{
    const f = r.fecha ? isoDate(new Date(r.fecha)) : '';
    if(f < d || f > h) return false;
    if(DF.tipo && r.tipo !== DF.tipo) return false;
    if(DF.ubic && r.ubic !== DF.ubic) return false;
    if(DF.estado){ if(r.estado !== DF.estado) return false; }
    else if(!activa(r)) return false;
    return true;
  });
}

function tablaTop(grupos, labelFn, total){

    <div class="h-1.5 bg-ink-100 rounded-full mt-1"><div class="h-1.5 rounded-full bg-brand-500" style="width:${Math.max(2,g.gasto*100/max)}%"></div></div></div>`).join('')}</div>`;
}
function gruposReserva(rows){
  const m = {};
  rows.forEach(r=>{ const g = m[r.reserva] = m[r.reserva] || {reserva:r.reserva, fecha:r.fecha, orden:r.orden, denom:r.denom, texto:r.texto, solicitante:r.solicitante, lineas:[], total:0}; g.lineas.push(r); g.total += r.total; });
  return Object.values(m).sort((a,b)=> String(b.fecha).localeCompare(String(a.fecha)));
}
function estadoGrupo(g){ const s = new Set(g.lineas.map(l=>l.estado)); return s.size===1 ? [...s][0] : 'Pendiente'; }

    </tr>`).join('')}</tbody></table></div>`;

function pintarGraficos(rows){
  if(typeof Chart === 'undefined') return;
  Object.values(CHARTS).forEach(c=>c.destroy());
  Chart.defaults.font.family = 'Inter'; Chart.defaults.font.size = 11; Chart.defaults.color = '#5a6b7d';
  const tip = {callbacks:{label: c => ' '+money(c.parsed.y ?? c.parsed.x ?? c.parsed)}};
  const grid = {color:'#eef1f5'};
  // Diario
  const dias = {}; rows.forEach(r=>{ const d = isoDate(new Date(r.fecha)); dias[d] = (dias[d]||0) + r.total; });
  const keys = Object.keys(dias).sort();
  const serie = []; if(keys.length){ for(let d = keys[0]; d <= keys[keys.length-1]; d = addDaysISO(d,1)){ serie.push([d, dias[d]||0]); if(serie.length>370) break; } }
  CHARTS.dia = new Chart(document.getElementById('chDia'), {type:'bar',
    data:{labels:serie.map(s=>ddmm(s[0])), datasets:[{data:serie.map(s=>Math.round(s[1]*100)/100), backgroundColor:'#1f83f7', borderRadius:4, maxBarThickness:28}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:tip}, scales:{x:{grid:{display:false}}, y:{grid, ticks:{callback:v=>moneyK(v)}}}}});
  // Tipo
  const pt = agrupar(rows, r=>r.tipo);
  CHARTS.tipo = new Chart(document.getElementById('chTipo'), {type:'doughnut',
    data:{labels:pt.map(g=>String(g.k).replace('OTM ','')), datasets:[{data:pt.map(g=>Math.round(g.gasto*100)/100), backgroundColor:pt.map(g=>TIPO_COLOR[g.k]||'#7c8b9b'), borderWidth:2, borderColor:'#fff'}]},
    options:{maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{boxWidth:10, usePointStyle:true}}, tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed)}`}}}}});
  const hbar = (id, grupos, color) => new Chart(document.getElementById(id), {type:'bar',
    data:{labels:grupos.map(g=>g.label||g.k), datasets:[{data:grupos.map(g=>Math.round(g.gasto*100)/100), backgroundColor:color, borderRadius:4, maxBarThickness:22}]},
    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>' '+money(c.parsed.x)}}},
      scales:{x:{grid, ticks:{callback:v=>moneyK(v)}}, y:{grid:{display:false}, ticks:{callback:function(v){ const l = this.getLabelForValue(v); return l.length>26 ? l.slice(0,25)+'…' : l; }}}}}});
  CHARTS.ubic = hbar('chUbic', agrupar(rows, r=>r.ubic).slice(0,10), '#0857a8');
  CHARTS.equipo = hbar('chEquipo', agrupar(rows, r=>r.equipo).slice(0,10).map(g=>({...g, label: (rows.find(r=>r.equipo===g.k)||{}).denom || g.k})), '#059669');
}
function exportarCSV(){
  const rows = reservasFiltradas();
  const cols = [['ID_Linea','id'],['ID_Reserva','reserva'],['Fecha','fecha'],['Orden','orden'],['Texto_Orden','texto'],['Clase','clase'],['Tipo_OTM','tipo'],['Equipo','equipo'],['Denominacion','denom'],['Ubicacion','ubic'],['Material','material'],['Descripcion','desc'],['UM','um'],['Cantidad','cantidad'],['Costo_Unit','cu'],['Costo_Total','total'],['Solicitante','solicitante'],['Estado','estado'],['Comentario','comentario']];
  const q = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [cols.map(c=>c[0]).join(';')].concat(rows.map(r=>cols.map(([,k])=> k==='fecha' ? fmtDateTime(r.fecha) : (typeof r[k]==='number' ? String(r[k]).replace('.',',') : q(r[k]))).join(';')));
  const blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `reservas_maquinaria_${hoyLima()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

async function cambiarEstado(ids, estado){
  if(estado==='Anulada' && !(await confirmar(`¿Anular ${ids.length} línea(s)? El stock comprometido se libera y no se puede revertir.`, 'Anular', true))) return;
  try{
    const usuario = SOLICITANTE || '';
    const d = await apiPost('cambiar_estado', {ids, estado, usuario});
    (d.actualizadas||[]).forEach(u=>{ const i = RESERVAS.findIndex(r=>r.id===u.id); if(i>=0) RESERVAS[i] = u; });
    recalcular();
    toast(`${ids.length} línea(s) → ${estado}`);
    refrescarVista();
  }catch(err){ toast('No se pudo cambiar el estado: '+err.message, 'error'); }
}

function pintarTablaStock(){

  let lista = STOCK.filter(m=>{

    if(SF.solo==='comp' && !(COMPROMETIDO[m.codigo]>0)) return false;
    return !toks.length || coincide(m._q, toks);
  });
  const cmp = {valor:(a,b)=>b.valor-a.valor, stock:(a,b)=>b.stock-a.stock, comp:(a,b)=>(COMPROMETIDO[b.codigo]||0)*b.cu-(COMPROMETIDO[a.codigo]||0)*a.cu, codigo:(a,b)=>a.codigo.localeCompare(b.codigo), desc:(a,b)=>a.desc.localeCompare(b.desc)}[SF.orden] || ((a,b)=>b.valor-a.valor);
  lista.sort(cmp);
  const pags = Math.max(1, Math.ceil(lista.length / CONFIG.PAGE_SIZE));
  stockPag = Math.min(stockPag, pags);

  const btn = m => { const {disp, car} = fila(m); return disp > 0

    : `<span class="text-[11px] text-ink-400">Sin disponible</span>`; };

      <tbody>${pag.map(m=>{ const {comp, disp} = fila(m); return `<tr class="border-t border-ink-50 hover:bg-ink-50/60">
        <td class="px-4 py-2 max-w-[380px]"><p class="font-medium text-ink-800 truncate">${esc(m.desc)}</p><p class="text-[11px] text-ink-400">${esc(m.codigo)}</p></td>
        <td class="px-2 py-2 text-ink-500">${esc(m.um)}</td>
        <td class="px-2 py-2 text-right tabular">${num(m.stock)}</td>
        <td class="px-2 py-2 text-right tabular ${comp?'text-amber-600 font-medium':'text-ink-300'}">${comp?num(comp):'—'}</td>
        <td class="px-2 py-2 text-right tabular font-semibold ${disp>0?'text-ink-900':'text-red-600'}">${num(disp)}</td>
        <td class="px-2 py-2 text-right tabular text-ink-600">${money(m.cu)}</td>
        <td class="px-2 py-2 text-right tabular text-ink-600">${money(m.valor)}</td>
        <td class="px-4 py-2 text-right">${btn(m)}</td></tr>`; }).join('')}</tbody>

  let ordenSel = CART.orden && esAsignable(ORD_MAP[CART.orden]) ? CART.orden : '';
  const pintar = () => {
    const disp = disponible(codigo), car = enCarrito(codigo);
    const o = ORD_MAP[ordenSel];
    AC.acOrd = {items: itemsOrdenesLib, vacio:`Sin órdenes ${CONFIG.ESTADO_ASIGNABLE} que coincidan en el periodo elegido`, onPick: v=>{ ordenSel = v; pintar(); setTimeout(()=>{ const c = document.getElementById('amCant'); if(c) c.focus(); }, 50); }};
    abrirModal(`${modalHeader('Asignar material a una OTM', `${esc(m.codigo)} · ${esc(m.desc)}`)}
      <div class="p-5 space-y-4">
        <div class="grid grid-cols-3 gap-2 text-xs bg-ink-50 rounded-lg p-3">
          <div><p class="text-ink-400">Disponible</p><p class="font-bold tabular">${num(disp)} ${esc(m.um)}</p></div>
          <div><p class="text-ink-400">Costo unitario</p><p class="font-medium tabular">${money(m.cu)}</p></div>
          <div><p class="text-ink-400">En reserva en curso</p><p class="font-medium tabular">${num(car)} ${esc(m.um)}</p></div>
        </div>
        <div>
          <label class="text-xs font-medium text-ink-600">Orden de mantenimiento <span class="text-ink-400 font-normal">(solo ${CONFIG.ESTADO_ASIGNABLE})</span></label>
          ${o ? `<div class="mt-1 flex items-center gap-2 border border-brand-200 bg-brand-50/50 rounded-lg px-3 py-2">
              <div class="min-w-0 flex-1"><p class="text-sm font-semibold text-ink-900">${esc(o.orden)} · ${esc(o.texto)}</p><p class="text-[11px] text-ink-500 truncate">${esc(o.denom)} · ${esc(o.ubic)}</p></div>
              <button onclick="window.__amCambiar()" class="text-xs text-brand-700 font-medium hover:underline">Cambiar</button></div>`
            : `<div class="mt-1">${chipsSemanaHTML('acOrd')}${acHTML('acOrd','Buscar orden, equipo o texto…')}</div>`}
        </div>
        <div>
          <label class="text-xs font-medium text-ink-600">Cantidad (${esc(m.um)})</label>
          <input id="amCant" type="number" inputmode="decimal" min="0" step="any" value="${car||''}" placeholder="0" class="${selCls} mt-1" oninput="window.__amCalc()">
          <p id="amCalc" class="text-[11px] text-ink-500 mt-1"></p>
        </div>
        ${CART.items.length && CART.orden && ordenSel && CART.orden!==ordenSel ? `<p class="text-[11px] text-amber-700 bg-amber-50 rounded-lg px-3 py-2">La reserva en curso es de la OTM ${esc(CART.orden)}. Si continúas, toda la reserva en curso (${CART.items.length} materiales) pasará a la OTM ${esc(ordenSel)}.</p>`:''}
        <div class="flex flex-col sm:flex-row gap-2 pt-1">
          <button onclick="window.__amAgregar(false)" class="flex-1 px-4 py-2.5 rounded-lg border border-brand-200 text-brand-700 text-sm font-medium hover:bg-brand-50">Agregar y seguir eligiendo</button>
          <button onclick="window.__amAgregar(true)" class="flex-1 px-4 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Agregar y revisar reserva</button>
        </div>
      </div>`, pintar, 'max-w-lg');
    window.__amCalc();
  };
  window.__amCambiar = () => { ordenSel = ''; pintar(); setTimeout(()=>document.getElementById('acOrd')?.focus(), 50); };
  window.__amCalc = () => {
    const c = Number(document.getElementById('amCant')?.value) || 0, disp = disponible(codigo), el = document.getElementById('amCalc');
    if(!el) return;
    el.innerHTML = c > disp ? `<span class="text-red-600 font-medium">Supera el disponible (${num(disp)} ${esc(m.um)})</span>` : c > 0 ? `Costo estimado: <b>${money(c*m.cu)}</b>` : '';
  };
  window.__amAgregar = (revisar) => {
    if(!ordenSel){ toast('Elige la orden de mantenimiento', 'error'); document.getElementById('acOrd')?.focus(); return; }
    if(!esAsignable(ORD_MAP[ordenSel])){ toast(`La orden ${ordenSel} no está en estado ${CONFIG.ESTADO_ASIGNABLE}`, 'error'); return; }
    const c = round3(Number(document.getElementById('amCant').value) || 0);
    if(!(c > 0)){ toast('Ingresa una cantidad mayor a 0', 'error'); return; }
    if(c > disponible(codigo)){ toast(`Solo hay ${num(disponible(codigo))} ${m.um} disponibles`, 'error'); return; }
    if(CART.orden !== ordenSel){ CART.orden = ordenSel; CART.token = ''; }
    const it = CART.items.find(x=>x.codigo===codigo);
    if(it) it.cantidad = c; else CART.items.push({codigo, cantidad:c});
    guardarCart();
    toast(`${m.desc.slice(0,40)} → OTM ${ordenSel}`, 'info');
    if(revisar) abrirCarrito(); else cerrarModal();
  };
  pintar();
}

/* =========================================================
   RESERVA EN CURSO (carrito)
   ========================================================= */
function guardarCart(){ lsSet('mq_cart', CART); paintCartBar(); }
function paintCartBar(){
  const n = CART.items.length;
  const b = document.getElementById('cartBadge');
  b.textContent = n; b.classList.toggle('hidden', !n); b.classList.toggle('flex', !!n);
  const bar = document.getElementById('cartBar');
  if(!n || document.getElementById('modalRoot').innerHTML){ bar.classList.add('hidden'); return; }
  const total = CART.items.reduce((s,it)=> s + it.cantidad * ((STOCK_MAP[it.codigo]||{}).cu||0), 0);
  const o = ORD_MAP[CART.orden];
  bar.classList.remove('hidden');
  bar.innerHTML = `<button onclick="abrirCarrito()" class="w-full flex items-center gap-3 bg-ink-900 text-white rounded-xl shadow-pop px-4 py-3 text-left">
    <span class="w-9 h-9 rounded-lg bg-brand-500 flex items-center justify-center font-bold">${n}</span>
    <span class="min-w-0 flex-1"><span class="block text-sm font-semibold truncate">Reserva en curso · OTM ${esc(CART.orden||'sin elegir')}</span>
    <span class="block text-[11px] text-ink-300 truncate">${esc(o?o.denom:'')} · ${money(total)}</span></span>
    <span class="text-xs font-semibold text-brand-300 whitespace-nowrap">Revisar →</span></button>`;
}
function asignarAOrden(orden){
  const o = ORD_MAP[orden];
  if(!esAsignable(o)){ toast(`Solo se asignan materiales a órdenes ${CONFIG.ESTADO_ASIGNABLE}`, 'error'); return; }
  if(CART.items.length && CART.orden && CART.orden !== orden){
    confirmar(`Tienes una reserva en curso para la OTM <b>${esc(CART.orden)}</b> con ${CART.items.length} material(es).<br><br>¿Descartarla y empezar una nueva para la OTM <b>${esc(orden)}</b>?`, 'Empezar nueva', true)
      .then(ok=>{ if(ok){ CART = {orden, items:[], token:''}; guardarCart(); abrirCarrito(); } });
    return;
  }
  if(CART.orden !== orden){ CART.orden = orden; CART.token = ''; guardarCart(); }
  abrirCarrito();
}
let guardando = false;
function abrirCarrito(){
  const pintar = () => {
    const o = ORD_MAP[CART.orden];
    AC.acMat = {items: itemsMateriales, vacio: STOCK_OK ? 'Sin materiales con disponible que coincidan' : 'Cargando stock…', onPick: v=>{ agregarItem(v); }};
    AC.acOrdC = {items: itemsOrdenesLib, vacio:`Sin órdenes ${CONFIG.ESTADO_ASIGNABLE} que coincidan en el periodo elegido`, onPick: v=>{ CART.orden = v; CART.token=''; guardarCart(); pintar(); }};
    let total = 0, hayError = false;
    const filas = CART.items.map((it, i)=>{
      const m = STOCK_MAP[it.codigo] || {desc:'(material sin stock en MB52)', um:'', cu:0};
      const disp = disponible(it.codigo), sub = it.cantidad * (m.cu||0);
      const err = !(it.cantidad > 0) || it.cantidad > disp;
      if(err) hayError = true;
      total += sub;
      return `<div class="flex items-center gap-2 py-2.5 border-b border-ink-50">
        <div class="min-w-0 flex-1"><p class="text-sm font-medium text-ink-800 truncate">${esc(m.desc)}</p>
          <p id="ci_info_${i}" class="text-[11px] ${err?'text-red-600 font-medium':'text-ink-400'}">${esc(it.codigo)} · disp. ${num(disp)} ${esc(m.um)} · ${money(m.cu)}/${esc(m.um)}</p></div>
        <input id="ci_q_${i}" type="number" inputmode="decimal" min="0" step="any" value="${it.cantidad}" oninput="setCantidad(${i}, this.value)" class="w-20 rounded-lg border ${err?'border-red-300':'border-ink-200'} px-2 py-1.5 text-sm text-right tabular">
        <span id="ci_sub_${i}" class="w-24 text-right text-sm font-semibold tabular">${money(sub)}</span>
        <button onclick="quitarItem(${i})" class="p-1.5 text-ink-400 hover:text-red-600" aria-label="Quitar">${IC.trash}</button></div>`;
    }).join('');
    abrirModal(`${modalHeader('Reserva de materiales', 'Asigna materiales del stock a una orden de mantenimiento')}
      <div class="p-5 space-y-4">
        <div>
          <label class="text-xs font-medium text-ink-600">Orden de mantenimiento <span class="text-ink-400 font-normal">(solo ${CONFIG.ESTADO_ASIGNABLE})</span></label>
          ${o ? `<div class="mt-1 flex items-center gap-2 border ${esAsignable(o)?'border-brand-200 bg-brand-50/50':'border-red-200 bg-red-50'} rounded-lg px-3 py-2">
              <div class="min-w-0 flex-1"><p class="text-sm font-semibold text-ink-900 flex flex-wrap items-center gap-2">${esc(o.orden)} ${badgeTipo(o.tipo)} ${badgeEstadoOrden(o)}</p>
              <p class="text-xs text-ink-700">${esc(o.texto)}</p><p class="text-[11px] text-ink-500 truncate">${esc(o.equipo)} · ${esc(o.denom)} · ${esc(o.ubic)}</p></div>
              <button onclick="CART.orden='';CART.token='';guardarCart();refrescarModal()" class="text-xs text-brand-700 font-medium hover:underline">Cambiar</button></div>`
            : `<div class="mt-1">${chipsSemanaHTML('acOrdC')}${acHTML('acOrdC','Buscar orden, equipo o texto…')}</div>`}
        </div>
        <div>
          <label class="text-xs font-medium text-ink-600">Agregar material del stock</label>
          <div class="mt-1">${acHTML('acMat','Buscar por código o descripción…')}</div>
        </div>
        <div>
          ${CART.items.length ? filas : `<div class="text-center text-xs text-ink-400 py-6 border border-dashed border-ink-200 rounded-lg">Aún no hay materiales en esta reserva</div>`}
          ${CART.items.length ? `<div class="flex justify-between items-center pt-3"><span class="text-xs text-ink-500">${CART.items.length} material(es)</span><span id="cartTotal" class="text-base font-bold text-ink-900 tabular">Total ${money(total)}</span></div>`:''}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div><label class="text-xs font-medium text-ink-600">Solicitante *</label>
            <input id="cSol" value="${esc(SOLICITANTE)}" onchange="SOLICITANTE=this.value.trim();lsSet('mq_solicitante',SOLICITANTE)" placeholder="Nombre de quien solicita" class="${selCls} mt-1"></div>
          <div><label class="text-xs font-medium text-ink-600">Comentario</label>
            <input id="cCom" value="${esc(CART.comentario||'')}" onchange="CART.comentario=this.value;guardarCart()" placeholder="Opcional" class="${selCls} mt-1"></div>
        </div>
        <div class="flex flex-col sm:flex-row gap-2 pt-1">
          <div class="flex gap-2">
            <button onclick="cerrarModal()" title="Cerrar sin registrar (la reserva en curso se conserva)" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-ink-200 text-sm text-ink-600 hover:bg-ink-50">Cancelar</button>
            ${CART.items.length?`<button onclick="vaciarCarrito()" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg border border-red-200 text-sm text-red-600 hover:bg-red-50">Vaciar</button>`:''}
          </div>
          <button data-guardar ${(!CART.items.length||hayError||!o)?'disabled':''} onclick="registrarReserva(false)" class="sm:ml-auto px-4 py-2.5 rounded-lg border border-brand-200 text-brand-700 text-sm font-medium hover:bg-brand-50 disabled:opacity-40">Solo registrar</button>
          <button data-guardar ${(!CART.items.length||hayError||!o)?'disabled':''} onclick="registrarReserva(true)" class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium disabled:opacity-40">${iconWhatsapp()} Registrar y enviar por WhatsApp</button>
        </div>
        <p id="cartErr" class="text-[11px] text-red-600 ${hayError?'':'hidden'}">Hay cantidades que superan el disponible o son 0. Corrígelas para registrar.</p>
      </div>`, pintar);
    if(!o) setTimeout(()=>document.getElementById('acOrdC')?.focus(), 60);
  };
  pintar();
  cargarStock(60000);
}
function agregarItem(codigo){
  const m = STOCK_MAP[codigo]; if(!m) return;
  if(!CART.items.find(x=>x.codigo===codigo)) CART.items.push({codigo, cantidad: Math.min(1, disponible(codigo))});
  const inp = document.getElementById('acMat'); if(inp) inp.value = '';   // limpia el buscador para el siguiente material
  guardarCart(); refrescarModal();
  setTimeout(()=>{ const ins = document.querySelectorAll('#modalPanel input[type=number]'); const i = CART.items.findIndex(x=>x.codigo===codigo); if(ins[i]){ ins[i].focus(); ins[i].select(); } }, 50);
}
/* Cambia la cantidad SIN volver a pintar el modal: actualiza solo subtotal, total y validaciones */
function setCantidad(i, v){
  const it = CART.items[i]; if(!it) return;
  it.cantidad = round3(Number(v)||0);
  guardarCart();
  let total = 0, hayError = false;
  CART.items.forEach((x, k)=>{
    const m = STOCK_MAP[x.codigo] || {cu:0};
    const err = !(x.cantidad > 0) || x.cantidad > disponible(x.codigo);
    if(err) hayError = true;
    total += x.cantidad * (m.cu||0);
    const sub = document.getElementById('ci_sub_'+k); if(sub) sub.textContent = money(x.cantidad * (m.cu||0));
    const info = document.getElementById('ci_info_'+k);
    if(info){ info.classList.toggle('text-red-600', err); info.classList.toggle('font-medium', err); info.classList.toggle('text-ink-400', !err); }
    const q = document.getElementById('ci_q_'+k);
    if(q){ q.classList.toggle('border-red-300', err); q.classList.toggle('border-ink-200', !err); }
  });
  const t = document.getElementById('cartTotal'); if(t) t.textContent = 'Total '+money(total);
  const e = document.getElementById('cartErr'); if(e) e.classList.toggle('hidden', !hayError);
  const bloquear = !CART.items.length || hayError || !ORD_MAP[CART.orden];
  if(!guardando) document.querySelectorAll('#modalPanel [data-guardar]').forEach(b=> b.disabled = bloquear);
}
function quitarItem(i){ CART.items.splice(i,1); guardarCart(); refrescarModal(); }
async function vaciarCarrito(){ if(await confirmar('¿Vaciar la reserva en curso?', 'Vaciar', true)){ CART = {orden:CART.orden, items:[], token:''}; guardarCart(); refrescarModal(); } }
function setGuardando(v){ guardando = v; document.querySelectorAll('[data-guardar]').forEach(b=>{ b.disabled = v; if(v) b.dataset.txt = b.innerHTML, b.innerHTML = 'Guardando…'; else if(b.dataset.txt) b.innerHTML = b.dataset.txt; }); }
function registrarReserva(enviarWA){
  if(guardando) return;
  const sol = (document.getElementById('cSol')?.value || '').trim();
  const com = (document.getElementById('cCom')?.value || '').trim();
  if(!sol){ toast('Indica el nombre del solicitante', 'error'); document.getElementById('cSol')?.focus(); return; }
  SOLICITANTE = sol; lsSet('mq_solicitante', sol);
  const o = ORD_MAP[CART.orden];
  if(!esAsignable(o)){ toast(`Solo se asignan materiales a órdenes ${CONFIG.ESTADO_ASIGNABLE}`, 'error'); return; }
  if(!CART.token){ CART.token = uid(); guardarCart(); }
  // La ventana de WhatsApp se abre YA (dentro del clic) para que el navegador no la bloquee
  const win = enviarWA ? window.open('', '_blank') : null;
  setGuardando(true);
  apiPost('registrar_reserva', {orden:CART.orden, solicitante:sol, comentario:com, token:CART.token, items:CART.items.map(it=>({material:it.codigo, cantidad:it.cantidad}))})
    .then(d=>{
      const nuevas = d.lineas || [];
      const ids = new Set(RESERVAS.map(r=>r.id));
      nuevas.forEach(l=>{ if(!ids.has(l.id)) RESERVAS.push(l); });
      recalcular();
      lsSet('mq_cache_core', {ordenes:ORDENES, reservas:RESERVAS, estadoAsignable:CONFIG.ESTADO_ASIGNABLE});
      toast(`Reserva ${d.reserva} registrada · ${nuevas.length} material(es)`);
      if(enviarWA){ const url = urlWhatsApp(mensajeReserva(d.reserva)); if(win) win.location.href = url; else window.location.href = url; }
      CART = {orden:'', items:[], token:''}; guardarCart();
      cerrarModal();
    })
    .catch(err=>{ if(win) win.close(); toast('No se pudo registrar: '+err.message, 'error'); cargarStock(); })
    .finally(()=> setGuardando(false));
}

/* =========================================================
   WHATSAPP
   ========================================================= */
function urlWhatsApp(texto){ const n = String(CONFIG.WHATSAPP_NUMERO||'').replace(/\D/g,''); return `https://wa.me/${n}?text=${encodeURIComponent(texto)}`; }
function mensajeReserva(reservaId){
  const lineas = RESERVAS.filter(r=>r.reserva===reservaId);
  if(!lineas.length) return '';
  const r = lineas[0];
  const activas = lineas.filter(activa);
  const total = activas.reduce((s,l)=>s+l.total,0);
  const l = [
    `🧰 *Reserva de materiales · Mantenimiento Maquinaria*`,
    `🆔 *Reserva:* ${reservaId}`,
    `📋 *OTM:* ${r.orden} — ${r.texto}`,
    `🏷️ *Tipo:* ${r.tipo} (${r.clase})`,
    `⚙️ *Equipo:* ${r.equipo} · ${r.denom}`,
    `📍 *Ubicación:* ${r.ubic}`,
    `👷 *Solicitante:* ${r.solicitante}`,
    `📅 *Fecha:* ${fmtDateTime(r.fecha)}`,
    `📦 *Materiales (${activas.length}):*`,
  ];
  lineas.forEach(x=> l.push(`▫️ ${x.material} - ${x.desc} — Cant: ${num(x.cantidad)} ${x.um} — ${money(x.total)}${x.estado!=='Pendiente'?` [${x.estado}]`:''}`));
  l.push(`💰 *Total:* ${money(total)}`);
  if(r.comentario) l.push(`📝 *Comentario:* ${r.comentario}`);
  return l.join('\n');
}
function reenviarReserva(id){ const t = mensajeReserva(id); if(t) window.open(urlWhatsApp(t), '_blank'); }

window.addEventListener('beforeunload', e=>{ if(guardando){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !document.getElementById('confirmRoot').innerHTML && document.getElementById('modalRoot').innerHTML && !document.querySelector('.ac-list:not(.hidden)')) cerrarModal(); });
initApp();
</script>
